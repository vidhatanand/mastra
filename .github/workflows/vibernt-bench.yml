# Vibernt runner benchmark (v045-b5). Manual dispatch only.
#
# Copies the steps of upstream jobs at this commit, unchanged except:
#   - runs-on is the `runner` input (GitHub-hosted baseline or a Vibernt drop-in label);
#   - the `github.repository == 'mastra-ai/mastra'` gates, `needs:` on the change-detection/prebuild jobs and the
#     reusable-workflow inputs are removed (full run: every shard, fixed store list);
#   - no secrets: TURBO_TOKEN/TURBO_TEAM and the cloud-store keys are dropped. TURBO_CACHE takes the value the upstream
#     expression yields without a token (local:rw), and remote:r where upstream hard-codes it;
#   - cache=cold puts a per-run tag into the pnpm store cache key (via cache-dependency-path) and the .turbo/cache key
#     and restore prefix so nothing restores; cache=warm uses a constant tag (pnpm store) and upstream's exact turbo
#     key and restore prefix.
#   - levers=all (0.4.5 lever round): setup-pnpm-node runs without its install and the install goes through
#     vibernt/ci/actions/deps@v1 (installed node_modules by exact install identity, verified offline). Mastra uses pnpm's
#     global virtual store, so node_modules are links into the pnpm store (restored by setup-pnpm-node's own store
#     cache); the deps step pins the store directory and runs with HOME=/tmp/vibernt-deps-home (a copy of the runner's
#     ~/.npmrc, so the dependency store still applies) because the action's side-effect check walks HOME, which holds
#     the workspace and the runner's logs. HUSKY=0 for the root `prepare: husky`. UNIT shards use
#     TURBO_CACHE=local:rw,remote:rw (upstream's value with a token) so turbo uses the runner's remote cache (Vibernt
#     drop-in sets TURBO_API/TOKEN/TEAM in the runner's .env; the workflow sets none); Memory and store jobs keep
#     upstream's remote:r. id-token: write for the Vibernt actions.
# Jobs: test-suite.yml `UNIT Test (Shard 1-4)`, prebuild.yml `Memory Tests`, test-combined-stores.yml `test (store)` for
# seven docker-compose stores that need no cloud credentials.
name: Vibernt bench

on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label
        type: choice
        options:
          - ubuntu-24.04
          - vibernt-ubuntu-24.04-4cpu
          - vibernt-ubuntu-24.04
        default: ubuntu-24.04
      cache:
        description: cold = cache keys that never match; warm = upstream cache keys
        type: choice
        options:
          - cold
          - warm
        default: warm
      levers:
        description: none = upstream setup; all = vibernt/ci deps around the install and turbo's remote cache in UNIT shards
        type: choice
        options:
          - none
          - all
        default: none

run-name: bench ${{ inputs.runner }} ${{ inputs.cache }} levers=${{ inputs.levers || 'none' }}

permissions: {}

env:
  BENCH_CACHE_TAG: ${{ inputs.cache == 'cold' && format('cold-{0}-{1}-', github.run_id, github.run_attempt) || '' }}

jobs:
  unit-test:
    name: UNIT Test (Shard ${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TURBO_CACHE: ${{ inputs.levers == 'all' && 'local:rw,remote:rw' || 'local:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          fetch-depth: 2

      - name: Bench cache key
        run: echo "${BENCH_CACHE_TAG:-warm}" > .bench-cache-key

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          install-dependencies: ${{ inputs.levers == 'all' && 'false' || 'true' }}
          cache-dependency-path: |
            pnpm-lock.yaml
            .bench-cache-key

      - name: Remove bench cache key
        run: rm -f .bench-cache-key

      - name: Store directory and deps home (levers)
        if: inputs.levers == 'all'
        run: |
          store=$(pnpm store path --silent)
          echo "DEPS_STORE_DIR=${store%/v[0-9]*}" >> "$GITHUB_ENV"
          mkdir -p /tmp/vibernt-deps-home
          if [[ -f "$HOME/.npmrc" ]]; then cp "$HOME/.npmrc" /tmp/vibernt-deps-home/.npmrc; fi

      - name: Install dependencies (vibernt/deps, levers)
        id: deps
        if: inputs.levers == 'all'
        uses: vibernt/ci/actions/deps@v1
        env:
          HUSKY: '0'
          HOME: /tmp/vibernt-deps-home
          npm_config_store_dir: ${{ env.DEPS_STORE_DIR }}
          pnpm_config_store_dir: ${{ env.DEPS_STORE_DIR }}

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ env.BENCH_CACHE_TAG }}${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ env.BENCH_CACHE_TAG }}

      - name: Build packages
        run: pnpm turbo build --filter "!./examples/**/*" --filter "!./docs/" --filter "!./explorations/**/*"

      - name: Run changed tests (Shard ${{ matrix.shard }}/4)
        run: |
          pnpm vitest run \
            --project 'unit:*' --project 'typecheck:*' \
            --reporter=blob \
            --reporter=verbose \
            --reporter=github-actions \
            --outputFile.blob=.vitest-reports/blob-unit-${{ matrix.shard }}.json \
            --shard=${{ matrix.shard }}/4 \
            --passWithNoTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-blob-unit-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  memory-test:
    name: Memory Tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mastra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379

    env:
      TURBO_CACHE: remote:r

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20

      - name: Bench cache key
        run: echo "${BENCH_CACHE_TAG:-warm}" > .bench-cache-key

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          install-dependencies: ${{ inputs.levers == 'all' && 'false' || 'true' }}
          cache-dependency-path: |
            pnpm-lock.yaml
            .bench-cache-key

      - name: Remove bench cache key
        run: rm -f .bench-cache-key

      - name: Store directory and deps home (levers)
        if: inputs.levers == 'all'
        run: |
          store=$(pnpm store path --silent)
          echo "DEPS_STORE_DIR=${store%/v[0-9]*}" >> "$GITHUB_ENV"
          mkdir -p /tmp/vibernt-deps-home
          if [[ -f "$HOME/.npmrc" ]]; then cp "$HOME/.npmrc" /tmp/vibernt-deps-home/.npmrc; fi

      - name: Install dependencies (vibernt/deps, levers)
        id: deps
        if: inputs.levers == 'all'
        uses: vibernt/ci/actions/deps@v1
        env:
          HUSKY: '0'
          HOME: /tmp/vibernt-deps-home
          npm_config_store_dir: ${{ env.DEPS_STORE_DIR }}
          pnpm_config_store_dir: ${{ env.DEPS_STORE_DIR }}

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ env.BENCH_CACHE_TAG }}${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ env.BENCH_CACHE_TAG }}

      - name: Build dependencies
        run: pnpm turbo build --filter "./stores/libsql" --filter "./stores/pg" --filter "./stores/upstash" --filter "mastra" --filter "@mastra/memory" --filter "@mastra/fastembed" --filter "@internal/llm-recorder" --filter "@internal/test-utils"
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Install integration test dependencies
        run: pnpm install
        working-directory: packages/memory/integration-tests

      - name: Run Memory tests
        run: pnpm vitest run
        working-directory: packages/memory/integration-tests
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          DB_URL: 'postgresql://postgres:postgres@localhost:5432/mastra'

  store-test:
    name: test (${{ matrix.store }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        store: [clickhouse, mongodb, pg, mysql, qdrant, chroma, redis]
    env:
      TURBO_CACHE: remote:r

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          persist-credentials: false

      - name: Bench cache key
        run: echo "${BENCH_CACHE_TAG:-warm}" > .bench-cache-key

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          install-dependencies: ${{ inputs.levers == 'all' && 'false' || 'true' }}
          cache-dependency-path: |
            pnpm-lock.yaml
            .bench-cache-key

      - name: Remove bench cache key
        run: rm -f .bench-cache-key

      - name: Store directory and deps home (levers)
        if: inputs.levers == 'all'
        run: |
          store=$(pnpm store path --silent)
          echo "DEPS_STORE_DIR=${store%/v[0-9]*}" >> "$GITHUB_ENV"
          mkdir -p /tmp/vibernt-deps-home
          if [[ -f "$HOME/.npmrc" ]]; then cp "$HOME/.npmrc" /tmp/vibernt-deps-home/.npmrc; fi

      - name: Install dependencies (vibernt/deps, levers)
        id: deps
        if: inputs.levers == 'all'
        uses: vibernt/ci/actions/deps@v1
        env:
          HUSKY: '0'
          HOME: /tmp/vibernt-deps-home
          npm_config_store_dir: ${{ env.DEPS_STORE_DIR }}
          pnpm_config_store_dir: ${{ env.DEPS_STORE_DIR }}

      - name: Build combined storage packages
        run: pnpm turbo --filter "@mastra/${{ matrix.store }}" build
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Run ${{ matrix.store }} tests
        run: pnpm test
        working-directory: stores/${{ matrix.store }}
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
